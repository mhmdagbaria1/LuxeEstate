<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxeEstate | שחזור כתובת דוא"ל</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <header class="top-bar">
    <a href="Main.html" class="brand-logo">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span>LuxeEstate</span>
    </a>

    <div class="top-left">
      <a href="signin1.html" class="nav-btn login-btn-outline">חזרה להתחברות</a>
      <button class="theme-toggle-btn" id="themeToggle" title="החלף ערכת נושא">🌙</button>
    </div>
  </header>

  <div class="center-screen-layout">
    <div class="glass-form-container">
      <h2>שחזור כתובת דוא"ל 🔍</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">אמת את שמך ומספר הטלפון לאיתור כתובת הדוא"ל הרשומה</p>

      <div id="errorAlert" style="display: none; color: #ff4d4d; background: rgba(255, 77, 77, 0.15); border: 1px solid rgba(255, 77, 77, 0.3); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.95rem; font-weight: 600;"></div>

      <form id="recoverForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="glass-label">שם פרטי</label>
            <input type="text" id="txtFirstName" class="glass-input" required>
          </div>

          <div class="form-group">
            <label class="glass-label">שם משפחה</label>
            <input type="text" id="txtLastName" class="glass-input" required>
          </div>
        </div>

        <div class="form-group">
          <label class="glass-label">מספר טלפון לנייד</label>
          <input type="tel" id="txtPhoneNumber" class="glass-input" pattern="[0-9]+"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')" title="נא להזין מספרים בלבד" required>
        </div>

        <button type="submit" class="glass-btn">אותר דוא"ל רשום</button>
      </form>

      <div id="resultBox" style="display: none; margin-top: 24px;">
        <div style="background: rgba(0, 242, 254, 0.1); padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border-glow); text-align: center;">
          <h3 style="color: var(--primary); margin-bottom: 12px; font-size: 1.4rem;">מצאנו את החשבון שלך! 🎉</h3>
          <p style="font-size: 1.05rem; margin-bottom: 16px; color: var(--text-muted);">כתובת הדוא"ל הרשומה בחשבונך היא:</p>
          <div id="emailDisplay" style="font-size: 1.3rem; font-weight: 800; color: #fff; background: rgba(8, 13, 26, 0.8); padding: 14px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); word-break: break-all; margin-bottom: 20px;">
          </div>
          <button type="button" onclick="goToLogin()" class="glass-btn">מעבר להתחברות</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const themeToggleBtn = document.getElementById("themeToggle");
    themeToggleBtn.addEventListener("click", () => {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const nextTheme = currentTheme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", nextTheme);
      themeToggleBtn.innerText = nextTheme === "light" ? "☀️" : "🌙";
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDfbIOTvjCb5XLvo9D-FvtoqAPKVMOdVGY",
      authDomain: "apartment-rental-5136c.firebaseapp.com",
      projectId: "apartment-rental-5136c",
      storageBucket: "apartment-rental-5136c.firebasestorage.app",
      messagingSenderId: "779553223641",
      appId: "1:779553223641:web:416a43ccfc689a21c15fc8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let foundEmail = "";

    document.getElementById("recoverForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const errorAlert = document.getElementById("errorAlert");
      if (errorAlert) {
        errorAlert.style.display = "none";
        errorAlert.textContent = "";
      }

      const firstName = document.getElementById("txtFirstName").value.trim();
      const lastName = document.getElementById("txtLastName").value.trim();
      const phoneNumber = document.getElementById("txtPhoneNumber").value.trim();

      try {
        let snapshot = await db.collection("guests")
          .where("FirstName", "==", firstName)
          .where("LastName", "==", lastName)
          .where("PhoneNumber", "==", phoneNumber)
          .get();

        if (snapshot.empty) {
          snapshot = await db.collection("guests")
            .where("FirstName", "==", firstName)
            .where("LastName", "==", lastName)
            .where("phone", "==", phoneNumber)
            .get();
        }

        if (!snapshot.empty) {
          const user = snapshot.docs[0].data();
          foundEmail = user.Email || user.email || "";
          document.getElementById("emailDisplay").innerText = foundEmail;
          document.getElementById("recoverForm").style.display = "none";
          document.getElementById("resultBox").style.display = "block";
        } else {
          foundEmail = "";
          const msg = "לא נמצא חשבון התואם לפרטים שהוזנו. נא לבדוק אותם ולנסות שוב.";
          if (errorAlert) {
            errorAlert.textContent = msg;
            errorAlert.style.display = "block";
          }
          alert(msg);
        }

      } catch (error) {
        console.error("Error recovering email:", error);
        foundEmail = "";
        const msg = "אירוע שגיאה בשחזור כתובת הדואל";
        if (errorAlert) {
          errorAlert.textContent = msg;
          errorAlert.style.display = "block";
        }
        alert(msg);
      }
    });

    function goToLogin() {
      if (foundEmail) {
        window.location.href = "signin1.html?email=" + encodeURIComponent(foundEmail);
      } else {
        window.location.href = "signin1.html";
      }
    }
  </script>

</body>

</html>
