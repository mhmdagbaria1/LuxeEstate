<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxeEstate | איפוס ושחזור סיסמה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <header class="top-bar">
    <a href="Main.html" class="brand-logo">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span>LuxeEstate</span>
    </a>

    <div class="top-left">
      <a href="signin1.html" class="nav-btn login-btn-outline">חזרה להתחברות</a>
      <button class="theme-toggle-btn" id="themeToggle" title="החלף ערכת נושא">🌙</button>
    </div>
  </header>

  <div class="center-screen-layout">
    <div class="glass-form-container">
      <h2>איפוס סיסמה מאובטח 🔑</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">אמת את הפרטים האישיים להגדרת סיסמה
        חדשה</p>

      <div id="errorAlert" style="display: none; color: #ff4d4d; background: rgba(255, 77, 77, 0.15); border: 1px solid rgba(255, 77, 77, 0.3); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.95rem; font-weight: 600;"></div>

      <form id="verifyForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="glass-label">שם פרטי</label>
            <input type="text" id="txtFirstName" class="glass-input" required>
          </div>

          <div class="form-group">
            <label class="glass-label">שם משפחה</label>
            <input type="text" id="txtLastName" class="glass-input" required>
          </div>
        </div>

        <div class="form-group">
          <label class="glass-label">כתובת דוא"ל</label>
          <input type="email" id="txtEmail" class="glass-input" required>
        </div>

        <div class="form-group">
          <label class="glass-label">מספר טלפון לאימות</label>
          <input type="tel" id="txtPhoneNumber" class="glass-input" pattern="[0-9]+"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')" title="נא להזין מספרים בלבד" required>
        </div>

        <button type="submit" class="glass-btn">אמת פרטים כעת</button>
      </form>

      <form id="resetForm" style="display: none;">
        <hr style="border: 1px solid var(--border-light); margin: 24px 0;">
        <h3 style="color: var(--primary); text-align: center; margin-bottom: 16px;">הזן סיסמה חדשה</h3>
        <div class="form-group">
          <label class="glass-label">סיסמה סודית חדשה</label>
          <input type="password" id="txtNewPassword" class="glass-input" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="glass-btn">עדכן סיסמה והתחבר</button>
      </form>
    </div>
  </div>

  <script>
    const themeToggleBtn = document.getElementById("themeToggle");
    themeToggleBtn.addEventListener("click", () => {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const nextTheme = currentTheme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", nextTheme);
      themeToggleBtn.innerText = nextTheme === "light" ? "☀️" : "🌙";
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDfbIOTvjCb5XLvo9D-FvtoqAPKVMOdVGY",
      authDomain: "apartment-rental-5136c.firebaseapp.com",
      projectId: "apartment-rental-5136c",
      storageBucket: "apartment-rental-5136c.firebasestorage.app",
      messagingSenderId: "779553223641",
      appId: "1:779553223641:web:416a43ccfc689a21c15fc8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let verifiedDocId = null;

    document.getElementById("verifyForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const errorAlert = document.getElementById("errorAlert");
      if (errorAlert) {
        errorAlert.style.display = "none";
        errorAlert.textContent = "";
      }

      const firstName = document.getElementById("txtFirstName").value.trim();
      const lastName = document.getElementById("txtLastName").value.trim();
      const email = document.getElementById("txtEmail").value.trim();
      const phoneNumber = document.getElementById("txtPhoneNumber").value.trim();

      try {
        const snapshot = await db.collection("guests")
          .where("Email", "==", email)
          .where("PhoneNumber", "==", phoneNumber)
          .where("FirstName", "==", firstName)
          .where("LastName", "==", lastName)
          .get();

        if (!snapshot.empty) {
          verifiedDocId = snapshot.docs[0].id;
          document.getElementById("verifyForm").style.display = "none";
          document.getElementById("resetForm").style.display = "block";
          alert("האימות עבר בהצלחה! כעת תוכל להזין סיסמה חדשה.");
        } else {
          verifiedDocId = null;
          const msg = "הפרטים שהוזנו אינם תואמים לשום חשבון במערכת. נא לבדוק ולנסות שוב.";
          if (errorAlert) {
            errorAlert.textContent = msg;
            errorAlert.style.display = "block";
          }
          alert(msg);
        }

      } catch (error) {
        console.error("Error during verification:", error);
        verifiedDocId = null;
        const msg = "אירעה שגיאה בתהליך האימות. נא לנסות שוב מאוחר יותר.";
        if (errorAlert) {
          errorAlert.textContent = msg;
          errorAlert.style.display = "block";
        }
        alert(msg);
      }
    });

    document.getElementById("resetForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const errorAlert = document.getElementById("errorAlert");
      if (errorAlert) {
        errorAlert.style.display = "none";
        errorAlert.textContent = "";
      }

      const newPassword = document.getElementById("txtNewPassword").value.trim();

      if (newPassword.length < 6) {
        const msg = "הסיסמה החדשה חייבת להכיל לפחות 6 תווים.";
        if (errorAlert) {
          errorAlert.textContent = msg;
          errorAlert.style.display = "block";
        }
        alert(msg);
        return;
      }

      if (!verifiedDocId) {
        alert("לא בוצע אימות תקין. נא להתחיל מחדש.");
        window.location.reload();
        return;
      }

      try {
        await db.collection("guests").doc(verifiedDocId).update({
          password: newPassword
        });
        alert("הסיסמה שונתה בהצלחה! תוכל להתחבר כעת עם הסיסמה החדשה.");
        window.location.href = "signin1.html";
      } catch (error) {
        console.error("Error updating password:", error);
        const msg = "אירעה שגיאה בעדכון הסיסמה. נא לנסות שוב מאוחר יותר.";
        if (errorAlert) {
          errorAlert.textContent = msg;
          errorAlert.style.display = "block";
        }
        alert(msg);
      }
    });
  </script>

</body>

</html>
