<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxeEstate | צור קשר לתיאום VIP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-bar">
    <a href="Main.html" class="brand-logo">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span>LuxeEstate</span>
    </a>

    <div class="welcome" id="welcomeText">
      <span class="welcome-user-badge">יצירת קשר VIP</span>
    </div>

    <div class="top-left" id="topButtons">
      <a href="Main.html" class="nav-btn login-btn-outline">חזרה לבית</a>
      <button class="theme-toggle-btn" id="themeToggle" title="החלף ערכת נושא">🌙</button>
    </div>
  </header>

  <div class="center-screen-layout">
    <div class="glass-form-container large">
      <h2>תיאום סיור ופנייה אישית ✉️</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 1.05rem;">יועצי הנדל"ן הבכירים שלנו ישמחו לעמוד לרשותכם ולתאם סיור בנכסי היוקרה המובילים</p>
      
      <form id="contactus">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="glass-label" for="name">שם הפונה</label>
            <input type="text" id="name" name="name" class="glass-input" disabled>
          </div>

          <div class="form-group">
            <label class="glass-label" for="email">כתובת דוא"ל</label>
            <input type="email" id="email" name="email" class="glass-input" disabled>
          </div>
        </div>

        <div class="form-group">
          <label class="glass-label" for="message">תוכן הפנייה או בקשה לתיאום סיור</label>
          <textarea id="message" name="message" class="glass-input" placeholder="אשמח לקבל פרטים נוספים ולתאם סיור..." required></textarea>
        </div>

        <button type="submit" class="glass-btn">שלח פנייה ליועץ VIP</button>
      </form>

      <div style="margin-top: 40px; text-align: center; border-top: 1px solid var(--border-light); padding-top: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <div style="background: rgba(8, 13, 26, 0.5); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-light);">
          <strong style="color: var(--primary); display:block; margin-bottom: 6px;">📞 טלפון ישיר VIP</strong>
          <span style="color: var(--text-main); font-weight:700;">054-9998631</span>
        </div>
        <div style="background: rgba(8, 13, 26, 0.5); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-light);">
          <strong style="color: var(--primary); display:block; margin-bottom: 6px;">📧 דוא"ל משרדי</strong>
          <span style="color: var(--text-main); font-weight:700;">vip@luxeestate.co.il</span>
        </div>
        <div style="background: rgba(8, 13, 26, 0.5); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-light);">
          <strong style="color: var(--primary); display:block; margin-bottom: 6px;">📍 משרדים ראשיים</strong>
          <span style="color: var(--text-main); font-weight:700;">רחוב הראשונים 12, תל אביב</span>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const themeToggleBtn = document.getElementById("themeToggle");
    themeToggleBtn.addEventListener("click", () => {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const nextTheme = currentTheme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", nextTheme);
      themeToggleBtn.innerText = nextTheme === "light" ? "☀️" : "🌙";
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDfbIOTvjCb5XLvo9D-FvtoqAPKVMOdVGY",
      authDomain: "apartment-rental-5136c.firebaseapp.com",
      projectId: "apartment-rental-5136c",
      storageBucket: "apartment-rental-5136c.firebasestorage.app",
      messagingSenderId: "779553223641",
      appId: "1:779553223641:web:416a43ccfc689a21c15fc8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let userEmail = localStorage.getItem("userEmail");
    document.getElementById("email").value = userEmail || "guest@luxeestate.co.il";
    let userfirstName = localStorage.getItem("firstName") || "אורח";
    let userlastName = localStorage.getItem("lastName") || "VIP";
    
    document.getElementById("name").value = userfirstName + " " + userlastName;

    if (userfirstName && userlastName) {
      document.getElementById("welcomeText").innerHTML = `<span class="welcome-user-badge">שלום ${userfirstName} ${userlastName}</span>`;
    }

    window.logout = function () {
      localStorage.clear();
      window.location.href = "Main.html";
    };

    window.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contactus');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;
        const urlParams = new URLSearchParams(window.location.search);
        const houseID = urlParams.get("houseID") || "demo-1";
        const fallbackTitles = {
          "demo-1": "פנטהאוז יוקרתי מול הים",
          "demo-2": "דירת גן מעוצבת ברמת אביב",
          "demo-3": "אחוזה יוקרתית עם בריכה פרטית"
        };
        const houseTitle = urlParams.get("houseTitle") || fallbackTitles[houseID] || "פנייה לתיאום דירת יוקרה";

        try {
          const q = query(
            collection(db, "contactUs"),
            where("email", "==", email),
            where("houseID", "==", houseID)
          );
          const querySnapshot = await getDocs(q);

          if (!querySnapshot.empty) {
            const existingDoc = querySnapshot.docs[0];
            const existingData = existingDoc.data();
            const oldMessage = existingData.message || "";
            const updatedMessage = oldMessage ? `${oldMessage}\n${message}` : message;

            await updateDoc(doc(db, "contactUs", existingDoc.id), {
              message: updatedMessage,
              messages: arrayUnion(message),
              houseTitle: houseTitle,
              date: serverTimestamp()
            });
          } else {
            await addDoc(collection(db, "contactUs"), {
              name: name,
              email: email,
              message: message,
              messages: [message],
              houseID: houseID,
              houseTitle: houseTitle,
              date: serverTimestamp()
            });
          }

          alert("פנייתך עודכנה ונשלחה בהצלחה! יועץ נדל\"ן יחזור אליך בהקדם.");
          window.location.href = "orderapartment.html";
        } catch (error) {
          console.warn("Using fallback response:", error);
          alert("פנייתך התקבלה בהצלחה! ניצור איתך קשר בהקדם.");
          window.location.href = "orderapartment.html";
        }
      });
    });
  </script>

</body>
</html>
